name: wordcalendar
description: TheWordCalendar - daily Scripture calendar and PDF viewer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: any
  cloud_firestore: any
  firebase_storage: ^13.6.0
  firebase_auth: any
  firebase_messaging: any
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  file_picker: any
  path_provider: any
  shared_preferences: any
  intl: any
  timezone: ^0.11.1
  http: ^1.2.2
  pdfrx: ^2.6.5
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
